kind = "web"
previewPath = "/"
title = "Perfumes de Luxo"
version = "1.0.0"
id = "artifacts/perfumes"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22724

[services.development]
run = "pnpm --filter @workspace/perfumes run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/perfumes", "run", "build" ]
publicDir = "artifacts/perfumes/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22724"
BASE_PATH = "/"
